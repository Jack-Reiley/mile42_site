<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The shell is what a crawler that does not run JavaScript sees, so it
         carries the Home page's title rather than a bare brand name. Layout
         replaces it per route once the app paints. src/go-live.test.jsx holds
         this and App.jsx's route table together. -->
    <title>Execution, Rebuilt. · Mile42</title>
    <meta
      name="description"
      content="Mile42 combines senior judgment with AI-native delivery, without bloated teams, endless billing, or recommendations that never become results."
    />

    <!-- Everything a shared link unfurls as is decided here. A social crawler
         does not run the app, so Layout's per-route title never reaches one,
         and every route shares this one card.

         og:url and og:image have to be absolute for the same reason: the
         crawler resolves them from its own host, not from this document.
         src/site-meta.js carries the origin they are built from, and
         src/social-metadata.test.jsx holds these values, that module, and the
         generated artwork together. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mile42" />
    <meta property="og:title" content="Execution, Rebuilt. · Mile42" />
    <meta
      property="og:description"
      content="Mile42 combines senior judgment with AI-native delivery, without bloated teams, endless billing, or recommendations that never become results."
    />
    <meta property="og:url" content="https://www.mile42.ai/" />
    <meta property="og:image" content="https://www.mile42.ai/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Mile42 lockup on a blue field, above the words: Execution, Rebuilt. The consulting model is broken. We didn’t bring it with us."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Execution, Rebuilt. · Mile42" />
    <meta
      name="twitter:description"
      content="Mile42 combines senior judgment with AI-native delivery, without bloated teams, endless billing, or recommendations that never become results."
    />
    <meta name="twitter:image" content="https://www.mile42.ai/share-card.png" />
    <meta
      name="twitter:image:alt"
      content="The Mile42 lockup on a blue field, above the words: Execution, Rebuilt. The consulting model is broken. We didn’t bring it with us."
    />

    <!-- The hero band's blue, which is what the card is drawn on. -->
    <meta name="theme-color" content="#006ae0" />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
